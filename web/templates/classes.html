<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类浏览器</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .class-layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; height: calc(100vh - 120px); }
        .class-list-panel {
            background: #1a1f3a; border-radius: 12px; border: 1px solid #2a2f4a;
            overflow: hidden; display: flex; flex-direction: column;
        }
        .class-list-header { padding: 12px 16px; border-bottom: 1px solid #2a2f4a; }
        .class-list-header input {
            width: 100%; padding: 8px 12px; background: #0a0e27; border: 1px solid #2a2f4a;
            border-radius: 6px; color: #e0e0e0; font-size: 13px;
        }
        .class-list-header input:focus { outline: none; border-color: #4fc3f7; }
        .class-list { overflow-y: auto; flex: 1; }
        .class-item {
            padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #1a1f3a;
            transition: background 0.15s; display: flex; align-items: center; gap: 8px;
        }
        .class-item:hover { background: #2a2f4a; }
        .class-item.active { background: #2a2f5a; border-left: 3px solid #4fc3f7; }
        .class-item .icon { color: #4fc3f7; font-size: 14px; }
        .class-item .name { color: #e0e0e0; font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .class-item .badge {
            font-size: 10px; padding: 2px 6px; border-radius: 10px;
            background: #2a2f4a; color: #aaa;
        }
        .class-detail-panel {
            background: #1a1f3a; border-radius: 12px; border: 1px solid #2a2f4a;
            overflow-y: auto; padding: 20px;
        }
        .class-detail-header { margin-bottom: 20px; }
        .class-detail-header h2 { color: #4fc3f7; margin-bottom: 8px; }
        .class-detail-header .meta { color: #888; font-size: 13px; }
        .detail-section { margin-bottom: 20px; }
        .detail-section h4 {
            color: #e0e0e0; font-size: 14px; margin-bottom: 10px;
            padding-bottom: 6px; border-bottom: 1px solid #2a2f4a;
            display: flex; align-items: center; gap: 6px;
        }
        .detail-section h4 i { color: #4fc3f7; font-size: 12px; }
        .member-item {
            padding: 8px 12px; background: #0a0e27; border-radius: 6px;
            margin-bottom: 4px; font-size: 13px; display: flex; align-items: center; gap: 8px;
        }
        .member-item .member-icon { font-size: 11px; }
        .member-item .member-name { color: #e0e0e0; }
        .member-item .member-type { color: #888; font-size: 11px; margin-left: auto; }
        .member-item .member-flags { display: flex; gap: 4px; }
        .flag-tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; }
        .flag-static { background: #1b5e20; color: #a5d6a7; }
        .flag-private { background: #b71c1c; color: #ef9a9a; }
        .flag-async { background: #4a148c; color: #ce93d8; }
        .flag-override { background: #e65100; color: #ffcc80; }
        .empty-state { text-align: center; color: #666; padding: 60px 20px; }
        .empty-state i { font-size: 48px; margin-bottom: 16px; display: block; }
        .inheritance-chain { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .inheritance-chain .chain-item {
            padding: 4px 10px; background: #0a0e27; border-radius: 4px;
            color: #4fc3f7; font-size: 12px; cursor: pointer;
        }
        .inheritance-chain .chain-arrow { color: #666; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header"><i class="fas fa-project-diagram"></i><span>ArkTS 知识图谱</span></div>
        <ul class="sidebar-menu">
            <li><a href="/"><i class="fas fa-home"></i> 总览</a></li>
            <li><a href="/graph"><i class="fas fa-bezier-curve"></i> 知识图谱</a></li>
            <li><a href="/query"><i class="fas fa-robot"></i> AI 智能查询</a></li>
            <li class="active"><a href="/classes"><i class="fas fa-cubes"></i> 类浏览器</a></li>
            <li><a href="/stats"><i class="fas fa-chart-bar"></i> 统计分析</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <header class="top-bar">
            <h2><i class="fas fa-cubes"></i> 类浏览器</h2>
        </header>
        <section class="class-layout">
            <div class="class-list-panel">
                <div class="class-list-header">
                    <input type="text" id="classSearch" placeholder="搜索类名..." />
                </div>
                <div class="class-list" id="classList">
                    <div class="empty-state"><i class="fas fa-search"></i>输入关键词搜索类</div>
                </div>
            </div>
            <div class="class-detail-panel" id="classDetail">
                <div class="empty-state">
                    <i class="fas fa-hand-pointer"></i>
                    <p>选择左侧的类查看详情</p>
                </div>
            </div>
        </section>
    </main>
    <script src="/static/js/classes_page.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => ClassesPage.init());
    </script>
</body>
</html>
